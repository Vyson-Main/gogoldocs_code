version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gogoldocs
      POSTGRES_USER:     gogoldocs
      POSTGRES_PASSWORD: gogoldocs_secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seeders/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [postgres]
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL:  postgres://gogoldocs:gogoldocs_secret@postgres:5432/gogoldocs
      JWT_SECRET:    change_me_in_production
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5500
      NODE_ENV:      production
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./shared:/shared

volumes:
  pg_data:
