<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoGolDocs</title>
  <meta name="description" content="A minimal, secure notes application." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="public/icons/favicon.svg" />

  <!-- Styles — cascade order matters -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/reset.css" />
  <link rel="stylesheet" href="src/styles/typography.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
  <link rel="stylesheet" href="src/styles/components.css" />

  <!-- Feature styles -->
  <link rel="stylesheet" href="src/features/auth/styles/auth.css" />
  <link rel="stylesheet" href="src/features/notes/styles/notes.css" />
  <link rel="stylesheet" href="src/features/security/styles/security.css" />
  <link rel="stylesheet" href="src/features/search/styles/search.css" />
  <link rel="stylesheet" href="src/features/theme/styles/theme.css" />
  <link rel="stylesheet" href="src/features/toasts/styles/toasts.css" />
  <link rel="stylesheet" href="src/features/autosave/styles/autosave.css" />
  <link rel="stylesheet" href="src/features/edit/styles/edit.css" />
  <link rel="stylesheet" href="src/features/delete/styles/delete.css" />
  <link rel="stylesheet" href="src/features/validation/styles/validation.css" />

  <!-- Runtime config: VITE_API_URL is set in Vercel environment variables -->
  <script>
    window.__ENV__ = {
      API_BASE_URL: '__VITE_API_URL__',
    };
    // If placeholder was not replaced (local dev), fall back to localhost
    if (window.__ENV__.API_BASE_URL === '__VITE_API_URL__') {
      window.__ENV__.API_BASE_URL = 'https://gogoldocs-code.onrender.com';
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
